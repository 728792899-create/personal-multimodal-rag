<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Personal Multimodal RAG system overview</title>
  <desc id="desc">A layered overview from multimodal sources through ingestion, retrieval, answer generation, citation audit, and evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071629"/>
      <stop offset="1" stop-color="#102c3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#f8fafc}.subtitle{font-size:16px;font-weight:400;fill:#94a3b8}
      .section{font-size:14px;font-weight:700;letter-spacing:1.5px;fill:#5eead4}.label{font-size:17px;font-weight:700;fill:#e2e8f0}.copy{font-size:13px;font-weight:400;fill:#94a3b8}
      .card{fill:#0f2437;stroke:#21445a;stroke-width:1.5}.card2{fill:#122b42;stroke:#2b6176;stroke-width:1.5}.line{stroke:#67e8f9;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="1220" cy="80" r="230" fill="#2563eb" opacity=".08"/>
  <circle cx="120" cy="690" r="260" fill="#14b8a6" opacity=".07"/>
  <text x="60" y="68" class="title">From mixed sources to auditable answers</text>
  <text x="60" y="98" class="subtitle">Local-first ingestion · hybrid retrieval · refusal gate · citation audit · regression feedback</text>

  <text x="60" y="152" class="section">1 · SOURCES</text>
  <g filter="url(#shadow)">
    <rect x="60" y="174" width="184" height="84" rx="16" class="card"/><text x="84" y="208" class="label">PDF / Markdown</text><text x="84" y="233" class="copy">text + metadata</text>
    <rect x="60" y="274" width="184" height="84" rx="16" class="card"/><text x="84" y="308" class="label">Images</text><text x="84" y="333" class="copy">optional OCR</text>
    <rect x="60" y="374" width="184" height="84" rx="16" class="card"/><text x="84" y="408" class="label">Public URL</text><text x="84" y="433" class="copy">SSRF-safe import</text>
    <rect x="60" y="474" width="184" height="84" rx="16" class="card"/><text x="84" y="508" class="label">Plain text</text><text x="84" y="533" class="copy">notes and snippets</text>
  </g>

  <text x="318" y="152" class="section">2 · INGESTION</text>
  <g filter="url(#shadow)">
    <rect x="318" y="174" width="220" height="120" rx="18" class="card2"/><text x="344" y="211" class="label">Safety guards</text><text x="344" y="238" class="copy">size · type · URL · timeout</text><text x="344" y="261" class="copy">filename · redirect · cleanup</text>
    <rect x="318" y="316" width="220" height="120" rx="18" class="card"/><text x="344" y="353" class="label">Parse &amp; chunk</text><text x="344" y="380" class="copy">content normalization</text><text x="344" y="403" class="copy">overlap · SHA-256 · quality</text>
    <rect x="318" y="458" width="220" height="100" rx="18" class="card"/><text x="344" y="495" class="label">Registry</text><text x="344" y="522" class="copy">SQLite metadata + content</text>
  </g>

  <text x="614" y="152" class="section">3 · RETRIEVAL</text>
  <g filter="url(#shadow)">
    <rect x="614" y="174" width="240" height="96" rx="18" class="card2"/><text x="640" y="211" class="label">BM25 branch</text><text x="640" y="238" class="copy">lexical recall</text>
    <rect x="614" y="290" width="240" height="96" rx="18" class="card2"/><text x="640" y="327" class="label">Vector branch</text><text x="640" y="354" class="copy">semantic recall</text>
    <rect x="614" y="406" width="240" height="152" rx="18" class="card"/><text x="640" y="443" class="label">Evidence pipeline</text><text x="640" y="470" class="copy">fusion + dedup</text><text x="640" y="493" class="copy">MMR + rerank</text><text x="640" y="516" class="copy">no-answer decision</text>
  </g>

  <text x="930" y="152" class="section">4 · ANSWER</text>
  <g filter="url(#shadow)">
    <rect x="930" y="174" width="214" height="120" rx="18" class="card2"/><text x="956" y="211" class="label">Generator</text><text x="956" y="238" class="copy">template or Responses</text><text x="956" y="261" class="copy">evidence constrained</text>
    <rect x="930" y="316" width="214" height="120" rx="18" class="card"/><text x="956" y="353" class="label">Citation audit</text><text x="956" y="380" class="copy">coverage · grounding</text><text x="956" y="403" class="copy">unsupported claims</text>
    <rect x="930" y="458" width="214" height="100" rx="18" class="card"/><text x="956" y="495" class="label">Trace</text><text x="956" y="522" class="copy">stage-by-stage evidence</text>
  </g>

  <text x="1220" y="152" class="section">5 · IMPROVE</text>
  <g filter="url(#shadow)">
    <rect x="1220" y="174" width="160" height="96" rx="18" class="card2"/><text x="1244" y="211" class="label">Feedback</text><text x="1244" y="238" class="copy">eval draft</text>
    <rect x="1220" y="290" width="160" height="96" rx="18" class="card"/><text x="1244" y="327" class="label">Golden set</text><text x="1244" y="354" class="copy">30 fixed cases</text>
    <rect x="1220" y="406" width="160" height="152" rx="18" class="card"/><text x="1244" y="443" class="label">CI gates</text><text x="1244" y="470" class="copy">Recall@K · MRR</text><text x="1244" y="493" class="copy">citations · refusal</text><text x="1244" y="516" class="copy">readable report</text>
  </g>

  <path d="M244 366 H292" class="line"/><path d="M538 366 H588" class="line"/><path d="M854 366 H904" class="line"/><path d="M1144 366 H1194" class="line"/>
  <path d="M1300 580 C1300 676 750 692 734 584" class="line" stroke-dasharray="7 8"/>
  <rect x="60" y="636" width="1320" height="64" rx="16" fill="#0b1f31" stroke="#21445a"/>
  <rect x="76" y="652" width="280" height="32" rx="16" fill="url(#accent)" opacity=".18"/><text x="98" y="674" class="copy" fill="#ccfbf1">Offline default: mock · memory · template</text>
  <text x="410" y="674" class="copy">Optional adapters: OpenAI-compatible · local embeddings · Chroma · pgvector · Sentry</text>
</svg>
