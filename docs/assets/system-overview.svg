<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc" lang="zh-CN" xml:lang="zh-CN">
  <title id="title">个人多模态 RAG 系统全景</title>
  <desc id="desc">从多模态资料、入库、检索到受证据约束的回答、引用审计和评测的分层概览。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071629"/>
      <stop offset="1" stop-color="#102c3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#f8fafc}.subtitle{font-size:16px;font-weight:400;fill:#94a3b8}
      .section{font-size:14px;font-weight:700;letter-spacing:1.5px;fill:#5eead4}.label{font-size:17px;font-weight:700;fill:#e2e8f0}.copy{font-size:13px;font-weight:400;fill:#94a3b8}
      .card{fill:#0f2437;stroke:#21445a;stroke-width:1.5}.card2{fill:#122b42;stroke:#2b6176;stroke-width:1.5}.line{stroke:#67e8f9;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="1220" cy="80" r="230" fill="#2563eb" opacity=".08"/>
  <circle cx="120" cy="690" r="260" fill="#14b8a6" opacity=".07"/>
  <text x="60" y="68" class="title">从混合资料到可审计回答</text>
  <text x="60" y="98" class="subtitle">本地优先入库 · 混合检索 · 拒答门 · 引用审计 · 回归反馈</text>

  <text x="60" y="152" class="section">1 · 资料来源</text>
  <g filter="url(#shadow)">
    <rect x="60" y="174" width="184" height="84" rx="16" class="card"/><text x="84" y="208" class="label">PDF / Markdown</text><text x="84" y="233" class="copy">文本与元数据</text>
    <rect x="60" y="274" width="184" height="84" rx="16" class="card"/><text x="84" y="308" class="label">图片</text><text x="84" y="333" class="copy">可选 OCR</text>
    <rect x="60" y="374" width="184" height="84" rx="16" class="card"/><text x="84" y="408" class="label">公开 URL</text><text x="84" y="433" class="copy">SSRF 安全导入</text>
    <rect x="60" y="474" width="184" height="84" rx="16" class="card"/><text x="84" y="508" class="label">纯文本</text><text x="84" y="533" class="copy">笔记与片段</text>
  </g>

  <text x="318" y="152" class="section">2 · 入库处理</text>
  <g filter="url(#shadow)">
    <rect x="318" y="174" width="220" height="120" rx="18" class="card2"/><text x="344" y="211" class="label">安全防护</text><text x="344" y="238" class="copy">大小 · 类型 · URL · 超时</text><text x="344" y="261" class="copy">文件名 · 重定向 · 清理</text>
    <rect x="318" y="316" width="220" height="120" rx="18" class="card"/><text x="344" y="353" class="label">解析与分块</text><text x="344" y="380" class="copy">内容规范化</text><text x="344" y="403" class="copy">重叠 · SHA-256 · 质量</text>
    <rect x="318" y="458" width="220" height="100" rx="18" class="card"/><text x="344" y="495" class="label">索引登记</text><text x="344" y="522" class="copy">SQLite 元数据与内容</text>
  </g>

  <text x="614" y="152" class="section">3 · 检索</text>
  <g filter="url(#shadow)">
    <rect x="614" y="174" width="240" height="96" rx="18" class="card2"/><text x="640" y="211" class="label">BM25 分支</text><text x="640" y="238" class="copy">词法召回</text>
    <rect x="614" y="290" width="240" height="96" rx="18" class="card2"/><text x="640" y="327" class="label">向量分支</text><text x="640" y="354" class="copy">语义召回</text>
    <rect x="614" y="406" width="240" height="152" rx="18" class="card"/><text x="640" y="443" class="label">证据链路</text><text x="640" y="470" class="copy">融合 · 去重</text><text x="640" y="493" class="copy">MMR · 重排</text><text x="640" y="516" class="copy">拒答判定</text>
  </g>

  <text x="930" y="152" class="section">4 · 回答</text>
  <g filter="url(#shadow)">
    <rect x="930" y="174" width="214" height="120" rx="18" class="card2"/><text x="956" y="211" class="label">生成器</text><text x="956" y="238" class="copy">模板或 Responses</text><text x="956" y="261" class="copy">受证据约束</text>
    <rect x="930" y="316" width="214" height="120" rx="18" class="card"/><text x="956" y="353" class="label">引用审计</text><text x="956" y="380" class="copy">覆盖率 · 依据</text><text x="956" y="403" class="copy">无依据声明</text>
    <rect x="930" y="458" width="214" height="100" rx="18" class="card"/><text x="956" y="495" class="label">检索追踪</text><text x="956" y="522" class="copy">分阶段证据</text>
  </g>

  <text x="1220" y="152" class="section">5 · 改进</text>
  <g filter="url(#shadow)">
    <rect x="1220" y="174" width="160" height="96" rx="18" class="card2"/><text x="1244" y="211" class="label">反馈</text><text x="1244" y="238" class="copy">评测草稿</text>
    <rect x="1220" y="290" width="160" height="96" rx="18" class="card"/><text x="1244" y="327" class="label">黄金集</text><text x="1244" y="354" class="copy">100 个固定案例</text>
    <rect x="1220" y="406" width="160" height="152" rx="18" class="card"/><text x="1244" y="443" class="label">CI 门槛</text><text x="1244" y="470" class="copy">Recall@K · MRR</text><text x="1244" y="493" class="copy">引用 · 拒答</text><text x="1244" y="516" class="copy">可读报告</text>
  </g>

  <path d="M244 366 H292" class="line"/><path d="M538 366 H588" class="line"/><path d="M854 366 H904" class="line"/><path d="M1144 366 H1194" class="line"/>
  <path d="M1300 580 C1300 676 750 692 734 584" class="line" stroke-dasharray="7 8"/>
  <rect x="60" y="636" width="1320" height="64" rx="16" fill="#0b1f31" stroke="#21445a"/>
  <rect x="76" y="652" width="280" height="32" rx="16" fill="url(#accent)" opacity=".18"/><text x="98" y="674" class="copy" fill="#ccfbf1">默认离线：模拟 · 内存 · 模板</text>
  <text x="410" y="674" class="copy">可选适配器：OpenAI-compatible · 本地嵌入 · Chroma · pgvector · Sentry</text>
</svg>
