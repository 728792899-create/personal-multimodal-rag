<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">Deployment modes from local demo to small-team beta</title>
  <desc id="desc">Three deployment levels: offline demo, durable single user, and small team beta with external services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#edf7f5"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow"><feDropShadow dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:30px;font-weight:700;fill:#0f172a}.s{font-size:16px;font-weight:400;fill:#475569}.tier{font-size:15px;font-weight:800;letter-spacing:1.4px;fill:#fff}.t{font-size:21px;font-weight:700;fill:#0f172a}.c{font-size:14px;font-weight:400;fill:#475569}.ok{font-size:14px;font-weight:700;fill:#0f766e}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}</style>
  </defs>
  <rect width="1440" height="650" rx="28" fill="url(#bg)"/>
  <text x="54" y="64" class="h">Grow the same architecture without breaking the demo</text><text x="54" y="94" class="s">The repository defaults to zero-key local use; durable services are adapters, not prerequisites.</text>
  <g filter="url(#shadow)">
    <rect x="54" y="142" width="408" height="438" rx="22" class="card"/><path d="M76 142h364a22 22 0 0 1 22 22v54H54v-54a22 22 0 0 1 22-22z" fill="#0f766e"/><text x="82" y="190" class="tier">LEVEL 1 · OFFLINE DEMO</text><text x="82" y="260" class="t">One command, no API key</text><text x="82" y="299" class="ok">✓ Mock hash embedding</text><text x="82" y="332" class="ok">✓ In-memory vector store</text><text x="82" y="365" class="ok">✓ Template answers</text><text x="82" y="398" class="ok">✓ SQLite registry</text><text x="82" y="443" class="c">Best for review, interviews, workshops,</text><text x="82" y="466" class="c">offline regression and UI development.</text><rect x="82" y="508" width="230" height="42" rx="21" fill="#ccfbf1"/><text x="105" y="535" class="ok">docker compose up --build</text>
    <rect x="516" y="142" width="408" height="438" rx="22" class="card"/><path d="M538 142h364a22 22 0 0 1 22 22v54H516v-54a22 22 0 0 1 22-22z" fill="#0e7490"/><text x="544" y="190" class="tier">LEVEL 2 · DURABLE SINGLE USER</text><text x="544" y="260" class="t">Persistent local knowledge</text><text x="544" y="299" class="ok">✓ Local sentence embeddings</text><text x="544" y="332" class="ok">✓ Chroma persistence</text><text x="544" y="365" class="ok">✓ Local files + backup</text><text x="544" y="398" class="ok">✓ Optional Responses model</text><text x="544" y="443" class="c">Best for a personal research vault or a</text><text x="544" y="466" class="c">trusted workstation with durable indexes.</text><rect x="544" y="508" width="196" height="42" rx="21" fill="#cffafe"/><text x="566" y="535" class="ok">Chroma + local models</text>
    <rect x="978" y="142" width="408" height="438" rx="22" class="card"/><path d="M1000 142h364a22 22 0 0 1 22 22v54H978v-54a22 22 0 0 1 22-22z" fill="url(#head)"/><text x="1006" y="190" class="tier">LEVEL 3 · SMALL-TEAM BETA</text><text x="1006" y="260" class="t">External durability and control</text><text x="1006" y="299" class="ok">✓ OIDC / workspace ownership</text><text x="1006" y="332" class="ok">✓ pgvector + object storage</text><text x="1006" y="365" class="ok">✓ Background indexing queue</text><text x="1006" y="398" class="ok">✓ Sentry + metrics + backups</text><text x="1006" y="443" class="c">Requires infrastructure and migration work</text><text x="1006" y="466" class="c">documented in production-adapters.md.</text><rect x="1006" y="508" width="222" height="42" rx="21" fill="#dbeafe"/><text x="1028" y="535" class="ok">Explicit production adapters</text>
  </g>
</svg>
