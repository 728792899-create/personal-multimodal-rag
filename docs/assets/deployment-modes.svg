<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc" lang="zh-CN" xml:lang="zh-CN">
  <title id="title">从离线演示到本地生产候选版的部署模式</title>
  <desc id="desc">三种部署层级：离线演示、耐久单用户，以及带外部服务的本地生产候选版。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#edf7f5"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow"><feDropShadow dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",Arial,Helvetica,sans-serif}.h{font-size:30px;font-weight:700;fill:#0f172a}.s{font-size:16px;font-weight:400;fill:#475569}.tier{font-size:15px;font-weight:800;letter-spacing:1.4px;fill:#fff}.t{font-size:21px;font-weight:700;fill:#0f172a}.c{font-size:14px;font-weight:400;fill:#475569}.ok{font-size:14px;font-weight:700;fill:#0f766e}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}</style>
  </defs>
  <rect width="1440" height="650" rx="28" fill="url(#bg)"/>
  <text x="54" y="64" class="h">在不破坏演示模式的前提下扩展同一架构</text><text x="54" y="94" class="s">仓库默认零密钥本地运行；耐久服务是可选适配器，不是前置条件。</text>
  <g filter="url(#shadow)">
    <rect x="54" y="142" width="408" height="438" rx="22" class="card"/><path d="M76 142h364a22 22 0 0 1 22 22v54H54v-54a22 22 0 0 1 22-22z" fill="#0f766e"/><text x="82" y="190" class="tier">级别 1 · 离线演示</text><text x="82" y="260" class="t">一条命令，无需 API 密钥</text><text x="82" y="299" class="ok">✓ 模拟哈希嵌入</text><text x="82" y="332" class="ok">✓ 内存向量存储</text><text x="82" y="365" class="ok">✓ 模板回答</text><text x="82" y="398" class="ok">✓ SQLite 登记簿</text><text x="82" y="443" class="c">适合评审、面试、工作坊，</text><text x="82" y="466" class="c">离线回归与 UI 开发。</text><rect x="82" y="508" width="230" height="42" rx="21" fill="#ccfbf1"/><text x="105" y="535" class="ok">docker compose up --build</text>
    <rect x="516" y="142" width="408" height="438" rx="22" class="card"/><path d="M538 142h364a22 22 0 0 1 22 22v54H516v-54a22 22 0 0 1 22-22z" fill="#0e7490"/><text x="544" y="190" class="tier">级别 2 · 耐久单用户</text><text x="544" y="260" class="t">耐久本地知识</text><text x="544" y="299" class="ok">✓ 本地句向量嵌入</text><text x="544" y="332" class="ok">✓ Chroma 持久化</text><text x="544" y="365" class="ok">✓ 本地文件与备份</text><text x="544" y="398" class="ok">✓ 可选 Responses 模型</text><text x="544" y="443" class="c">适合个人研究库或</text><text x="544" y="466" class="c">具备耐久索引的可信工作站。</text><rect x="544" y="508" width="196" height="42" rx="21" fill="#cffafe"/><text x="566" y="535" class="ok">Chroma + 本地模型</text>
    <rect x="978" y="142" width="408" height="438" rx="22" class="card"/><path d="M1000 142h364a22 22 0 0 1 22 22v54H978v-54a22 22 0 0 1 22-22z" fill="url(#head)"/><text x="1006" y="190" class="tier">级别 3 · 本地生产候选版</text><text x="1006" y="260" class="t">单管理员耐久部署</text><text x="1006" y="299" class="ok">✓ Argon2id 会话 + CSRF</text><text x="1006" y="332" class="ok">✓ pgvector + 对象存储</text><text x="1006" y="365" class="ok">✓ Redis Streams 工作队列</text><text x="1006" y="398" class="ok">✓ 可选 Sentry + 指标 + 备份</text><text x="1006" y="443" class="c">需要基础设施与迁移工作，</text><text x="1006" y="466" class="c">详见 production-local.md。</text><rect x="1006" y="508" width="222" height="42" rx="21" fill="#dbeafe"/><text x="1028" y="535" class="ok">显式生产配置</text>
  </g>
</svg>
