<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc" lang="zh-CN" xml:lang="zh-CN">
  <title id="title">SQLite v5 数据模型、向量存储与生产环境规范化边界</title>
  <desc id="desc">本地候选版在 SQLite 中保存知识库、文档、多模态元素、内容寻址资产、带溯源的图节点和边、耐久任务、会话与审计；分块和嵌入保留在兼容的向量存储中。生产环境需要工作区规范化与分布式基础设施。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef8f7"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0f766e"/></marker>
    <filter id="shadow"><feDropShadow dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",Arial,Helvetica,sans-serif}.h{font-size:30px;font-weight:700;fill:#0f172a}.sub{font-size:16px;fill:#475569}.k{font-size:13px;font-weight:700;letter-spacing:1.3px;fill:#0f766e}.t{font-size:17px;font-weight:700;fill:#0f172a}.c{font-size:13px;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.store{fill:#ecfeff;stroke:#22a6b3;stroke-width:1.5}.graph{fill:#f0fdfa;stroke:#14b8a6;stroke-width:1.5}.line{fill:none;stroke:#0f766e;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:6 6;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="920" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" class="h">耐久本地 v5 数据模型与生产工作区边界</text>
  <text x="54" y="92" class="sub">按操作获取 SQLite 连接 · 迁移备份 · 溯源门 · 向量兼容性 · 单一本地工作进程</text>
  <text x="54" y="140" class="k">当前单实例候选版</text>

  <g filter="url(#shadow)">
    <rect x="54" y="170" width="250" height="126" rx="18" class="box"/><text x="78" y="204" class="t">knowledge_bases</text><text x="78" y="232" class="c">默认库不可删除</text><text x="78" y="256" class="c">检索范围，不等同租户认证</text><text x="78" y="280" class="c">本地数据级联删除边界</text>
    <rect x="356" y="170" width="250" height="126" rx="18" class="box"/><text x="380" y="204" class="t">documents</text><text x="380" y="232" class="c">知识库 · 内容哈希 · 载荷</text><text x="380" y="256" class="c">解析器 · 增强 · 图谱版本</text><text x="380" y="280" class="c">索引版本 · needs_rebuild</text>
    <rect x="658" y="170" width="250" height="126" rx="18" class="store"/><text x="682" y="204" class="t">chunks / 向量存储</text><text x="682" y="232" class="c">元素 ID · 模态 · 父级</text><text x="682" y="256" class="c">已校验维度与版本</text><text x="682" y="280" class="c">memory / Chroma / pgvector</text>
    <rect x="960" y="170" width="250" height="126" rx="18" class="box"/><text x="984" y="204" class="t">index_jobs</text><text x="984" y="232" class="c">阶段 · 进度 · 幂等性</text><text x="984" y="256" class="c">租约 · 尝试次数 · 取消</text><text x="984" y="280" class="c">安全错误信息 · 源资产</text>

    <rect x="54" y="340" width="552" height="126" rx="18" class="box"/><text x="78" y="374" class="t">document_elements · assets · parser_runs</text><text x="78" y="402" class="c">文本 / 标题 / 图片 / 表格 / 公式 / 代码 · 页码 · bbox · 顺序</text><text x="78" y="426" class="c">内容寻址的原件与派生对象 · 受控资产 API</text><text x="78" y="450" class="c">解析配置、置信度、原件可用性与级联删除</text>
    <rect x="658" y="340" width="552" height="126" rx="18" class="graph"/><text x="682" y="374" class="t">enrichment_cache · graph_nodes · graph_edges · entity_mentions</text><text x="682" y="402" class="c">内容 + 上下文 + 提供方 + 模型 + 提示词版本缓存键</text><text x="682" y="426" class="c">文档 / 元素 / 实体节点 · contains / mentions / 显式关系</text><text x="682" y="450" class="c">每条可检索边都保留证据元素、片段、置信度与版本</text>

    <rect x="54" y="510" width="250" height="112" rx="18" class="box"/><text x="78" y="544" class="t">conversations</text><text x="78" y="572" class="c">标题 · 知识库范围</text><text x="78" y="596" class="c">created_at · updated_at</text>
    <rect x="356" y="510" width="250" height="112" rx="18" class="box"/><text x="380" y="544" class="t">conversation_messages</text><text x="380" y="572" class="c">角色 · 内容 · 流式状态</text><text x="380" y="596" class="c">最终引用审计元数据</text>
    <rect x="658" y="510" width="552" height="112" rx="18" class="box"/><text x="682" y="544" class="t">审计与兼容性表</text><text x="682" y="572" class="c">history · feedback · operation_logs · knowledge_cards · eval_cases</text><text x="682" y="596" class="c">schema_migrations · 旧版 /api/ask 保持兼容</text>
  </g>

  <path d="M304 233H356" class="line"/><path d="M606 233H658" class="line"/><path d="M960 233H908" class="dash"/>
  <path d="M482 296V340" class="line"/><path d="M783 296V340" class="line"/><path d="M304 566H356" class="line"/>
  <text x="312" y="217" class="c">knowledge_base_id</text><text x="622" y="217" class="c">document_id</text><text x="912" y="217" class="c">任务写入</text>

  <rect x="54" y="674" width="1332" height="196" rx="22" fill="#0f172a"/>
  <text x="82" y="710" class="k" fill="#5eead4">生产环境规范化边界</text>
  <text x="82" y="746" class="t" fill="#f8fafc">workspace_id 和 user_id 必须由服务端推导，不能由浏览器 JSON 声明。</text>
  <text x="82" y="778" class="c" fill="#cbd5e1">workspaces → memberships → KB/documents/elements/graph/chunks/conversations/jobs · 对象键和队列声明共享同一边界</text>
  <rect x="82" y="808" width="270" height="42" rx="21" fill="#134e4a"/><text x="108" y="834" class="t" fill="#ccfbf1">PostgreSQL + RLS</text>
  <rect x="372" y="808" width="270" height="42" rx="21" fill="#164e63"/><text x="398" y="834" class="t" fill="#cffafe">pgvector 版本控制</text>
  <rect x="662" y="808" width="270" height="42" rx="21" fill="#1e3a8a"/><text x="688" y="834" class="t" fill="#dbeafe">对象所有权</text>
  <rect x="952" y="808" width="350" height="42" rx="21" fill="#312e81"/><text x="978" y="834" class="t" fill="#e0e7ff">分布式队列 + 审计</text>
</svg>
