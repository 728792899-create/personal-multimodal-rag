<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc" lang="zh-CN" xml:lang="zh-CN">
  <title id="title">从浏览器操作到证据响应的请求生命周期</title>
  <desc id="desc">同源浏览器请求依次经过 Nginx、请求防护、领域路由、RAG 服务、存储和可选提供方，再返回回答、拒答、追踪和请求 ID。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#0d3540"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker>
    <filter id="shadow"><feDropShadow dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/></filter>
    <style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",Arial,Helvetica,sans-serif}.h{font-size:30px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.k{font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#5eead4}.t{font-size:17px;font-weight:700;fill:#e2e8f0}.c{font-size:13px;fill:#94a3b8}.n{font-size:14px;font-weight:700;fill:#06252d}.box{fill:#10283b;stroke:#2a566b;stroke-width:1.5}.line{fill:none;stroke:#67e8f9;stroke-width:2.4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="660" rx="28" fill="url(#bg)"/>
  <circle cx="1320" cy="10" r="250" fill="#2563eb" opacity=".08"/>
  <text x="54" y="64" class="h">一次操作，一条可观测的请求生命周期</text>
  <text x="54" y="94" class="sub">取消、超时、请求 ID、拒答与回退全程可见。</text>
  <rect x="54" y="122" width="1332" height="7" rx="4" fill="url(#accent)"/>

  <path d="M218 296H256" class="line"/><path d="M430 296H468" class="line"/><path d="M662 296H700" class="line"/><path d="M894 296H932" class="line"/><path d="M1126 296H1164" class="line"/>
  <g filter="url(#shadow)">
    <rect x="54" y="188" width="164" height="216" rx="20" class="box"/><circle cx="86" cy="220" r="18" fill="#5eead4"/><text x="81" y="225" class="n">1</text><text x="78" y="270" class="t">Vue 工作台</text><text x="78" y="300" class="c">用户操作</text><text x="78" y="324" class="c">AbortController</text><text x="78" y="348" class="c">超时 + 重试</text><text x="78" y="372" class="c">同源 /api</text>
    <rect x="256" y="188" width="174" height="216" rx="20" class="box"/><circle cx="288" cy="220" r="18" fill="#2dd4bf"/><text x="283" y="225" class="n">2</text><text x="280" y="270" class="t">Nginx</text><text x="280" y="300" class="c">静态前端</text><text x="280" y="324" class="c">/api 反向代理</text><text x="280" y="348" class="c">502 / 504 边界</text><text x="280" y="372" class="c">healthz</text>
    <rect x="468" y="188" width="194" height="216" rx="20" class="box"/><circle cx="500" cy="220" r="18" fill="#22d3ee"/><text x="495" y="225" class="n">3</text><text x="492" y="270" class="t">请求防护</text><text x="492" y="300" class="c">可选 Bearer</text><text x="492" y="324" class="c">进程内限流</text><text x="492" y="348" class="c">Retry-After</text><text x="492" y="372" class="c">X-Request-ID</text>
    <rect x="700" y="188" width="194" height="216" rx="20" class="box"/><circle cx="732" cy="220" r="18" fill="#38bdf8"/><text x="727" y="225" class="n">4</text><text x="724" y="270" class="t">领域路由</text><text x="724" y="300" class="c">文档</text><text x="724" y="324" class="c">检索</text><text x="724" y="348" class="c">质量</text><text x="724" y="372" class="c">Pydantic 校验</text>
    <rect x="932" y="188" width="194" height="216" rx="20" class="box"/><circle cx="964" cy="220" r="18" fill="#60a5fa"/><text x="959" y="225" class="n">5</text><text x="956" y="270" class="t">RAG 服务</text><text x="956" y="300" class="c">解析 + 检索</text><text x="956" y="324" class="c">门控 + 生成</text><text x="956" y="348" class="c">引用审计</text><text x="956" y="372" class="c">安全日志</text>
    <rect x="1164" y="188" width="222" height="216" rx="20" class="box"/><circle cx="1196" cy="220" r="18" fill="#818cf8"/><text x="1191" y="225" class="n">6</text><text x="1188" y="270" class="t">存储 / 提供方</text><text x="1188" y="300" class="c">SQLite 登记簿</text><text x="1188" y="324" class="c">BM25 + 向量存储</text><text x="1188" y="348" class="c">模板 / Responses</text><text x="1188" y="372" class="c">可选外部调用</text>
  </g>

  <path d="M1270 422C1270 488 1040 502 894 502H252C170 502 136 472 136 424" class="line" stroke-dasharray="7 7"/>
  <text x="520" y="488" class="k">响应路径</text>
  <rect x="54" y="528" width="1332" height="82" rx="18" fill="#0b2032" stroke="#285168"/>
  <text x="82" y="562" class="t">回答或拒答 · 引用 · 十阶段追踪 · 图谱溯源 · 置信度 · 审计 · 历史 ID</text>
  <text x="82" y="588" class="c">出错保留上次成功回答；重试重复原操作；请求 ID 将 UI 状态关联至安全的服务端日志。</text>
</svg>
