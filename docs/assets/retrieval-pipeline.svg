<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Ten-stage multimodal and graph retrieval pipeline</title>
  <desc id="desc">Query enrichment, BM25, vector recall, fusion, graph navigation, parent expansion, MMR, reranking, answer decision, and citation audit form an inspectable evidence pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f766e"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow"><feDropShadow dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".11"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0f766e"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:30px;font-weight:700;fill:#0f172a}.sub{font-size:16px;fill:#475569}.n{font-size:15px;font-weight:800;fill:#fff}.t{font-size:17px;font-weight:700;fill:#0f172a}.c{font-size:13px;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.flow{fill:none;stroke:#0f766e;stroke-width:2.5;marker-end:url(#arrow)}.optional{stroke:#7c3aed;stroke-dasharray:6 5}</style>
  </defs>
  <rect width="1440" height="720" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" class="h">One question, ten inspectable evidence stages</text>
  <text x="54" y="92" class="sub">Multimodal context and provenance-backed graph paths extend hybrid retrieval without bypassing refusal or citation gates.</text>
  <rect x="54" y="120" width="1332" height="8" rx="4" fill="url(#bar)"/>

  <path d="M294 235 H316" class="flow"/><path d="M556 235 H578" class="flow"/><path d="M818 235 H840" class="flow"/><path d="M1080 235 H1102" class="flow"/>
  <path d="M1222 312 V350 H174 V386" class="flow"/>
  <path d="M294 485 H316" class="flow"/><path d="M556 485 H578" class="flow"/><path d="M818 485 H840" class="flow"/><path d="M1080 485 H1102" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="54" y="158" width="240" height="154" rx="18" class="box"/><circle cx="86" cy="190" r="18" fill="#0f766e"/><text x="81" y="196" class="n">1</text><text x="78" y="238" class="t">Query enrichment</text><text x="78" y="266" class="c">image OCR + VLM summary</text><text x="78" y="288" class="c">original intent remains visible</text>
    <rect x="316" y="158" width="240" height="154" rx="18" class="box"/><circle cx="348" cy="190" r="18" fill="#0d9488"/><text x="343" y="196" class="n">2</text><text x="340" y="238" class="t">BM25 recall</text><text x="340" y="266" class="c">exact terms + titles</text><text x="340" y="288" class="c">matched tokens and counts</text>
    <rect x="578" y="158" width="240" height="154" rx="18" class="box"/><circle cx="610" cy="190" r="18" fill="#0891b2"/><text x="605" y="196" class="n">3</text><text x="602" y="238" class="t">Vector recall</text><text x="602" y="266" class="c">semantic candidates</text><text x="602" y="288" class="c">provider + similarity</text>
    <rect x="840" y="158" width="240" height="154" rx="18" class="box"/><circle cx="872" cy="190" r="18" fill="#0284c7"/><text x="867" y="196" class="n">4</text><text x="864" y="238" class="t">Fusion</text><text x="864" y="266" class="c">weighted scores + dedupe</text><text x="864" y="288" class="c">branch provenance retained</text>
    <rect x="1102" y="158" width="284" height="154" rx="18" class="box optional"/><circle cx="1134" cy="190" r="18" fill="#7c3aed"/><text x="1129" y="196" class="n">5</text><text x="1126" y="238" class="t">Graph navigation</text><text x="1126" y="266" class="c">entity seeds + evidence paths</text><text x="1126" y="288" class="c">optional weighted RRF · w=0.25</text>

    <rect x="54" y="408" width="240" height="154" rx="18" class="box"/><circle cx="86" cy="440" r="18" fill="#2563eb"/><text x="81" y="446" class="n">6</text><text x="78" y="488" class="t">Parent expansion</text><text x="78" y="516" class="c">element + adjacent context</text><text x="78" y="538" class="c">precise citation locator</text>
    <rect x="316" y="408" width="240" height="154" rx="18" class="box"/><circle cx="348" cy="440" r="18" fill="#3b82f6"/><text x="343" y="446" class="n">7</text><text x="340" y="488" class="t">MMR diversity</text><text x="340" y="516" class="c">relevance vs repetition</text><text x="340" y="538" class="c">lambda is inspectable</text>
    <rect x="578" y="408" width="240" height="154" rx="18" class="box"/><circle cx="610" cy="440" r="18" fill="#4f46e5"/><text x="605" y="446" class="n">8</text><text x="602" y="488" class="t">Rerank</text><text x="602" y="516" class="c">keyword or model adapter</text><text x="602" y="538" class="c">final evidence ordering</text>
    <rect x="840" y="408" width="240" height="154" rx="18" class="box"/><circle cx="872" cy="440" r="18" fill="#6d28d9"/><text x="867" y="446" class="n">9</text><text x="864" y="488" class="t">Decision gate</text><text x="864" y="516" class="c">answer or refuse</text><text x="864" y="538" class="c">threshold + reason code</text>
    <rect x="1102" y="408" width="284" height="154" rx="18" class="box"/><circle cx="1134" cy="440" r="18" fill="#7c3aed"/><text x="1125" y="446" class="n">10</text><text x="1126" y="488" class="t">Citation audit</text><text x="1126" y="516" class="c">coverage + grounding</text><text x="1126" y="538" class="c">unsupported claims surfaced</text>
  </g>

  <rect x="54" y="608" width="1332" height="62" rx="18" fill="#0f172a"/>
  <text x="82" y="646" class="sub" fill="#e2e8f0">Trace evidence: candidate counts · branch scores · graph relations · element IDs · latency · fallback · refusal reason · citation coverage</text>
</svg>
