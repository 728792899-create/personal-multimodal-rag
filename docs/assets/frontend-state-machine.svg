<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc" lang="zh-CN" xml:lang="zh-CN">
  <title id="title">前端请求状态机</title>
  <desc id="desc">空闲操作进入进行中，随后转为成功、错误或已取消；重试保留原始操作，可恢复错误期间仍显示成功数据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#edf7f5"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0f766e"/></marker>
    <style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",Arial,Helvetica,sans-serif}.h{font-size:30px;font-weight:700;fill:#0f172a}.sub{font-size:16px;fill:#475569}.t{font-size:18px;font-weight:700;fill:#0f172a}.c{font-size:13px;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.pending{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.success{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.error{fill:#fff1f2;stroke:#be123c;stroke-width:2}.cancel{fill:#f8fafc;stroke:#64748b;stroke-width:2}.line{fill:none;stroke:#0f766e;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 6;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="560" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" class="h">每个异步操作都有可见、可恢复的状态</text>
  <text x="54" y="92" class="sub">上传、URL 导入、提问、上下文、删除与评测使用相互独立的进行中标志。</text>

  <path d="M270 270H378" class="line"/><path d="M614 238H752" class="line"/><path d="M614 270C682 270 682 388 752 388" class="line"/><path d="M496 344V388H752" class="line"/>
  <path d="M988 388C1072 388 1072 270 1140 270" class="line"/><path d="M1140 318C1052 492 496 510 496 344" class="dash"/>
  <g>
    <rect x="54" y="192" width="216" height="156" rx="20" class="box"/><text x="82" y="232" class="t">空闲 / 就绪</text><text x="82" y="264" class="c">控件可用</text><text x="82" y="288" class="c">空状态或上次成功</text><text x="82" y="312" class="c">语义标签 + 焦点</text>
    <rect x="378" y="192" width="236" height="156" rx="20" class="pending"/><text x="406" y="232" class="t">进行中</text><text x="406" y="264" class="c">进度提示</text><text x="406" y="288" class="c">冲突操作已禁用</text><text x="406" y="312" class="c">取消仍可操作</text>
    <rect x="752" y="160" width="236" height="156" rx="20" class="success"/><text x="780" y="200" class="t">成功</text><text x="780" y="232" class="c">新文档 / 回答</text><text x="780" y="256" class="c">引用 + 追踪</text><text x="780" y="280" class="c">焦点行为可预测</text>
    <rect x="752" y="340" width="236" height="156" rx="20" class="error"/><text x="780" y="380" class="t">错误</text><text x="780" y="412" class="c">可读错误信息</text><text x="780" y="436" class="c">请求 ID + Retry-After</text><text x="780" y="460" class="c">保留上次成功结果</text>
    <rect x="1140" y="192" width="246" height="156" rx="20" class="box"/><text x="1168" y="232" class="t">重试</text><text x="1168" y="264" class="c">同一操作快照</text><text x="1168" y="288" class="c">无需重新输入</text><text x="1168" y="312" class="c">回到进行中</text>
    <rect x="378" y="388" width="236" height="108" rx="20" class="cancel"/><text x="406" y="428" class="t">已取消</text><text x="406" y="460" class="c">中止不会显示为失败</text>
  </g>
  <text x="54" y="526" class="c">减少动态效果会移除非必要过渡；390px 布局仍以纵向堆叠呈现同一状态，不会横向溢出。</text>
</svg>
