<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Frontend request state machine</title>
  <desc id="desc">Idle actions move to pending, then success, error or cancelled states; retry preserves the original operation and successful data remains visible during recoverable errors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#edf7f5"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0f766e"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:30px;font-weight:700;fill:#0f172a}.sub{font-size:16px;fill:#475569}.t{font-size:18px;font-weight:700;fill:#0f172a}.c{font-size:13px;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.pending{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.success{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.error{fill:#fff1f2;stroke:#be123c;stroke-width:2}.cancel{fill:#f8fafc;stroke:#64748b;stroke-width:2}.line{fill:none;stroke:#0f766e;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 6;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="560" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" class="h">Every async action has a visible, recoverable state</text>
  <text x="54" y="92" class="sub">Upload, URL import, ask, context, delete and evaluation use independent pending flags.</text>

  <path d="M270 270H378" class="line"/><path d="M614 238H752" class="line"/><path d="M614 270C682 270 682 388 752 388" class="line"/><path d="M496 344V388H752" class="line"/>
  <path d="M988 388C1072 388 1072 270 1140 270" class="line"/><path d="M1140 318C1052 492 496 510 496 344" class="dash"/>
  <g>
    <rect x="54" y="192" width="216" height="156" rx="20" class="box"/><text x="82" y="232" class="t">Idle / ready</text><text x="82" y="264" class="c">enabled controls</text><text x="82" y="288" class="c">empty or last success</text><text x="82" y="312" class="c">semantic labels + focus</text>
    <rect x="378" y="192" width="236" height="156" rx="20" class="pending"/><text x="406" y="232" class="t">Pending</text><text x="406" y="264" class="c">progress label</text><text x="406" y="288" class="c">conflicting actions disabled</text><text x="406" y="312" class="c">cancel remains available</text>
    <rect x="752" y="160" width="236" height="156" rx="20" class="success"/><text x="780" y="200" class="t">Success</text><text x="780" y="232" class="c">new documents / answer</text><text x="780" y="256" class="c">citations + trace</text><text x="780" y="280" class="c">focus stays predictable</text>
    <rect x="752" y="340" width="236" height="156" rx="20" class="error"/><text x="780" y="380" class="t">Error</text><text x="780" y="412" class="c">readable message</text><text x="780" y="436" class="c">request ID + Retry-After</text><text x="780" y="460" class="c">last success is preserved</text>
    <rect x="1140" y="192" width="246" height="156" rx="20" class="box"/><text x="1168" y="232" class="t">Retry</text><text x="1168" y="264" class="c">same operation snapshot</text><text x="1168" y="288" class="c">no re-entry required</text><text x="1168" y="312" class="c">returns to Pending</text>
    <rect x="378" y="388" width="236" height="108" rx="20" class="cancel"/><text x="406" y="428" class="t">Cancelled</text><text x="406" y="460" class="c">Abort is not shown as failure</text>
  </g>
  <text x="54" y="526" class="c">Reduced motion removes nonessential transitions; 390px layouts stack the same states without horizontal overflow.</text>
</svg>
