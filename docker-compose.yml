services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-mock}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-256}
      VECTOR_STORE: ${VECTOR_STORE:-memory}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-template}
      QUERY_REWRITE_PROVIDER: ${QUERY_REWRITE_PROVIDER:-none}
      DOCUMENT_REGISTRY_PATH: /app/data/registry.sqlite3
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANSWER_API_KEY: ${ANSWER_API_KEY:-}
      QUERY_REWRITE_API_KEY: ${QUERY_REWRITE_API_KEY:-}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8010:8010"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped
