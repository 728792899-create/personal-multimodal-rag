name: personal-multimodal-rag-production

x-backend-environment: &backend-environment
  RAG_RUNTIME_MODE: production
  APP_ENVIRONMENT: production
  PROVIDER_FALLBACK_ALLOWED: "0"
  METADATA_BACKEND: postgres
  METADATA_DSN_FILE: /run/secrets/metadata_dsn
  VECTOR_STORE: pgvector
  PGVECTOR_DSN_FILE: /run/secrets/metadata_dsn
  PGVECTOR_TABLE: rag_chunks
  OBJECT_STORE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: rag-objects
  S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
  S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
  S3_CACHE_PATH: /app/cache/objects
  RAG_STAGING_PATH: /tmp/rag-staging
  SOURCE_ROOTS: /sources
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  JOB_QUEUE_BACKEND: redis
  REDIS_URL_FILE: /run/secrets/redis_url
  AUTH_MODE: session
  ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
  SESSION_SECRET_FILE: /run/secrets/session_secret
  SESSION_COOKIE_SECURE: "1"
  EMBEDDING_PROVIDER: ollama
  EMBEDDING_MODEL: nomic-embed-text
  EMBEDDING_DIMENSION: "768"
  ANSWER_PROVIDER: ollama
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
  OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
  ENRICHMENT_PROVIDER: template
  QUERY_REWRITE_PROVIDER: none
  INDEX_VERSION: production-v1
  EMBEDDED_WORKER: "0"
  FETCH_WORKER_URL: http://fetch-worker:8091
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SERVICE_NAME: personal-multimodal-rag

x-backend-secrets: &backend-secrets
  - metadata_dsn
  - redis_url
  - s3_access_key
  - s3_secret_key
  - admin_password_hash
  - session_secret

services:
  fetch-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.production
    command: ["python", "-m", "uvicorn", "fetch_worker.main:app", "--host", "0.0.0.0", "--port", "8091"]
    environment:
      APP_ENVIRONMENT: production
      RAG_RUNTIME_MODE: demo
      RAG_ALLOW_PRIVATE_URLS: "0"
      URL_IMPORT_TIMEOUT_SECONDS: "12"
      URL_IMPORT_MAX_BYTES: "2000000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: personal_rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d personal_rag"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    secrets:
      - s3_access_key
      - s3_secret_key
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - s3_access_key
      - s3_secret_key
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$(cat /run/secrets/s3_access_key)" "$$(cat /run/secrets/s3_secret_key)" &&
        mc mb --ignore-existing local/rag-objects &&
        mc anonymous set none local/rag-objects
    restart: "no"

  clamav:
    image: clamav/clamav:1.4.2
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.production
    environment:
      <<: *backend-environment
    secrets: *backend-secrets
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      fetch-worker:
        condition: service_healthy
    read_only: true
    volumes:
      - ${SOURCE_DIRECTORY:-./data/sources}:/sources:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /app/cache:size=1g,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.production
    command: ["python", "/app/scripts/run_index_worker.py"]
    environment:
      <<: *backend-environment
      EMBEDDED_WORKER: "1"
    secrets: *backend-secrets
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    volumes:
      - ${SOURCE_DIRECTORY:-./data/sources}:/sources:ro
    tmpfs:
      - /tmp:size=2g,mode=1777
      - /app/cache:size=1g,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
    ports:
      - "${RAG_HTTP_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    profiles: ["observability"]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER__FILE: /run/secrets/grafana_admin_user
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_user
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
  prometheus_data:
  grafana_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  metadata_dsn:
    file: ${METADATA_DSN_FILE:-./secrets/metadata_dsn}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:-./secrets/redis_password}
  redis_url:
    file: ${REDIS_URL_FILE:-./secrets/redis_url}
  s3_access_key:
    file: ${S3_ACCESS_KEY_FILE:-./secrets/s3_access_key}
  s3_secret_key:
    file: ${S3_SECRET_KEY_FILE:-./secrets/s3_secret_key}
  admin_password_hash:
    file: ${ADMIN_PASSWORD_HASH_FILE:-./secrets/admin_password_hash}
  session_secret:
    file: ${SESSION_SECRET_FILE:-./secrets/session_secret}
  grafana_admin_user:
    file: ${GRAFANA_ADMIN_USER_FILE:-./secrets/grafana_admin_user}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./secrets/grafana_admin_password}
