name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  APP_ENVIRONMENT: test
  PROVIDER_FALLBACK_ALLOWED: "1"
  EMBEDDING_PROVIDER: mock
  VECTOR_STORE: memory
  ANSWER_PROVIDER: template
  ENRICHMENT_PROVIDER: template
  QUERY_REWRITE_PROVIDER: none
  OPENAI_API_KEY: ""
  ANSWER_API_KEY: ""
  QUERY_REWRITE_API_KEY: ""

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check documentation links and SVG accessibility
        run: python scripts/check_docs.py
      - name: Scan tracked files for committed secrets
        run: python scripts/check_secrets.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Backend tests
        run: python -m pytest -q
        env:
          DOCUMENT_REGISTRY_PATH: ":memory:"
      - name: Isolated SQLite and object-store restore drill
        run: python -m pytest -q backend/tests/test_restore_drill.py
        env:
          DOCUMENT_REGISTRY_PATH: ":memory:"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Unit and component tests
        run: npm --prefix frontend test
      - name: Production build
        run: npm --prefix frontend run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Offline end-to-end tests
        run: npm --prefix frontend run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  retrieval-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Enforce golden-set thresholds
        run: python scripts/run_retrieval_eval.py
      - name: Upload readable eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: eval/reports
          if-no-files-found: error

  multimodal-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Validate deterministic image fixtures
        run: python scripts/generate_multimodal_eval_fixtures.py --check
      - name: Enforce multimodal retrieval and extraction thresholds
        run: python scripts/run_eval_group.py multimodal
      - name: Upload multimodal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-eval-report
          path: eval/reports/multimodal.*
          if-no-files-found: error

  graph-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Enforce provenance graph and multi-hop thresholds
        run: python scripts/run_eval_group.py graph
      - name: Upload graph report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-eval-report
          path: eval/reports/graph.*
          if-no-files-found: error

  parser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Validate built-in and isolated parser contracts
        run: python -m pytest -q backend/tests/test_multimodal_elements.py

  asset-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Validate temporary assets, signatures, limits, expiry and KB isolation
        run: |
          python scripts/generate_multimodal_eval_fixtures.py --check
          python -m pytest -q backend/tests/test_query_assets.py backend/tests/test_upload_security.py

  docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docs, backend, frontend, retrieval-eval, multimodal-eval, graph-eval, parser-contract, asset-security]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start offline stack
        run: docker compose up --build --wait --wait-timeout 180 -d
      - name: Verify proxied health endpoints
        run: |
          curl --fail --show-error http://127.0.0.1:8010/ready
          curl --fail --show-error http://127.0.0.1:5173/healthz
          curl --fail --show-error http://127.0.0.1:5173/api/documents
      - name: Verify frontend survives backend container replacement
        run: |
          docker compose up -d --no-deps --force-recreate --wait --wait-timeout 180 backend
          sleep 12
          curl --fail --show-error http://127.0.0.1:8010/ready
          curl --fail --show-error http://127.0.0.1:5173/ready
          curl --fail --show-error http://127.0.0.1:5173/api/documents
      - name: Print service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
