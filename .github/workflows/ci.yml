name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  EMBEDDING_PROVIDER: mock
  VECTOR_STORE: memory
  ANSWER_PROVIDER: template
  QUERY_REWRITE_PROVIDER: none
  OPENAI_API_KEY: ""
  ANSWER_API_KEY: ""
  QUERY_REWRITE_API_KEY: ""

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Backend tests
        run: python -m pytest -q
        env:
          DOCUMENT_REGISTRY_PATH: ":memory:"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Unit and component tests
        run: npm --prefix frontend test
      - name: Production build
        run: npm --prefix frontend run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Offline end-to-end tests
        run: npm --prefix frontend run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  retrieval-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Enforce golden-set thresholds
        run: python scripts/run_retrieval_eval.py
      - name: Upload readable eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: eval/reports
          if-no-files-found: error

  docker-compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend, retrieval-eval]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start offline stack
        run: docker compose up --build --wait --wait-timeout 180 -d
      - name: Verify proxied health endpoints
        run: |
          curl --fail --show-error http://127.0.0.1:8010/ready
          curl --fail --show-error http://127.0.0.1:5173/healthz
          curl --fail --show-error http://127.0.0.1:5173/api/documents
      - name: Print service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
